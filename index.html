<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quay số trúng thưởng</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 1rem;
      min-height: 100vh;
      background: #ffffff;
      background-size: cover;
      font-family: sans-serif;
      margin: 0;
      padding: 1rem;
      box-sizing: border-box;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      background: transparent;
      width: 100%;
      max-width: 500px;
    }
    .panel {
      border-radius: 1rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      box-sizing: border-box;
    }
    .setup-panel {
      background: rgba(255, 255, 255, 0.9);
    }
    .play-panel {
      display: none;
      position: relative;
    }
    textarea {
      width: 100%; 
      max-width: 400px;
      height: 120px;
      box-sizing: border-box;
    }
    .button {
      background: #2563eb;
      color: #fff;
      font-weight: bold;
      padding: 0.8rem 1.5rem;
      border-radius: 9999px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      border: none;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.2s;
    }
    .button:hover {
        opacity: 0.9;
    }
    .wheel-container {
      position: relative;
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
    .arrow-top {
      position: absolute;
      top: -25px;
      left: 50%;
      transform: translateX(-50%) rotate(180deg);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 25px solid red;
      z-index: 10;
    }
    .wheel {
      width: 85vw;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      box-shadow: 0 0 0 4px #ccc;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      transform: translateZ(0);
    }
    .start-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      font-size: 1.2rem;
      padding: 0.8rem 1.2rem;
    }
    .result {
      display: inline-block;
      margin-top: 1rem;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ef4444;
      text-align: center;
      background: #fff;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
      max-width: 90vw;
      white-space: pre-line;
    }
    #history {
      margin-top: 1rem;
      width: 100%; 
      max-width: 400px;
      text-align: left;
      font-size: 0.9rem;
      color: #374151;
    }
    .confetti {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .control-buttons-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }
    .control-buttons-row .button {
      flex: 1 1 auto;
      min-width: 80px;
      padding: 0.6rem 0.5rem;
      font-size: 0.9rem;
    }
    #clear-history {
      background: #ef4444;
    }
    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    #toggle-controls-btn {
        background-color: transparent;
        flex-grow: 0;
        flex-basis: 44px;
        width: 44px;
        height: 44px;
        padding: 0;
        border-radius: 50%;
        font-size: 1.2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: none;
    }
    .device-choice-container {
        display: flex;
        gap: 1rem;
        align-items: center;
        margin-top: 1rem;
        padding: 0.5rem;
        border: 1px solid #ddd;
        border-radius: 0.5rem;
    }
    .device-choice-container > div {
        display: flex;
        gap: 0.25rem;
        align-items: center;
    }
  </style>
</head>
<body>
<audio id="spin-sound" src="wheel_spin.mp3" preload="auto"></audio>

<div class="container">
  <div id="setup" class="panel setup-panel">
    <textarea id="prize-input" placeholder="Nhập giải theo định dạng: tên giải|số lượng|trọng số|mã màu&#10;Ví dụ:&#10;Giải A|3|5|#FF0000&#10;Giải B|2|1|blue&#10;Giải C|1|1|rgb(0,255,0)&#10;Giải D|5||hsl(60,100%,50%) (trọng số mặc định là 1)&#10;Giải E|10|3|#00FFFF&#10;Để trống trọng số, sử dụng 2 dấu gạch đứng liên tiếp (||)"></textarea>
    <button class="button" id="update-button">Cập nhật giải</button>
    
    <div class="checkbox-container">
      <input type="checkbox" id="show-zero-quantity">
      <label for="show-zero-quantity">Hiển thị giải thưởng hết hàng</label>
    </div>

    <input type="file" id="bg-file" accept="image/*" style="display: none;">
    <button class="button" id="bg-button">Chọn ảnh nền</button>
    
    <div class="device-choice-container">
      <label>Chế độ:</label>
      <div>
        <input type="radio" id="mode-pc" name="device-mode" value="pc">
        <label for="mode-pc">PC</label>
      </div>
      <div>
        <input type="radio" id="mode-mobile" name="device-mode" value="mobile" checked>
        <label for="mode-mobile">Mobile</label>
      </div>
    </div>

    <button class="button" id="ready-button">Ready</button>
  </div>

  <div id="play" class="panel play-panel">
    <canvas class="confetti" id="confetti"></canvas>
    <div class="wheel-container">
      <div class="arrow-top"></div>
      <div class="wheel" id="wheel">
        <svg id="wheel-svg" viewBox="0 0 200 200" width="100%" height="100%"></svg>
      </div>
      <button class="button start-button" id="start-button">Quay</button>
    </div>
    <div class="result" id="result"></div>
    <div id="history"><strong>Lịch sử trúng thưởng:</strong><ul id="history-list"></ul></div>
    
    <div class="control-buttons-row">
      <button id="download-history" class="button control-btn">History</button>
      <button id="clear-history" class="button control-btn">Xóa lịch sử</button>
      <button id="setup-button" class="button control-btn">Setup</button>
      <button id="toggle-controls-btn" class="button" title="Ẩn/hiện các nút chức năng (Phím F1)">👁️</button>
    </div>
  </div>
</div>

<script src="confetti.browser.min.js"></script>
<script>
let prizes = [];
let lastRotation = 0;
let spinning = false;
let historyData = [];
let spinSound;
let showZeroQuantityPrizes = false;
let showControlButtons = true;

function prizesToInputText(prizeList) {
  return prizeList.map(p => {
    const parts = [p.label, p.count, p.weight];
    if (p.customColor) parts.push(p.customColor);
    return parts.join('|');
  }).join('\n');
}

function saveAppState() {
  const isPlaying = document.getElementById('play').style.display === 'flex';
  const state = {
    panel: isPlaying ? 'play' : 'setup',
    prizeInput: document.getElementById('prize-input').value,
    prizes: prizes,
    lastRotation: lastRotation,
    deviceMode: document.getElementById('mode-pc').checked ? 'pc' : 'mobile',
    showZeroQuantity: showZeroQuantityPrizes,
    showControls: showControlButtons
  };
  localStorage.setItem('app_state', JSON.stringify(state));
}

function restoreAppState() {
  const stateJson = localStorage.getItem('app_state');
  if (!stateJson) { updateWheel(); return; }

  let state;
  try { state = JSON.parse(stateJson); } catch (e) { updateWheel(); return; }

  if (state.prizeInput) {
    document.getElementById('prize-input').value = state.prizeInput;
  }
  if (state.deviceMode === 'pc') {
    document.getElementById('mode-pc').checked = true;
  } else {
    document.getElementById('mode-mobile').checked = true;
  }
  if (state.showZeroQuantity !== undefined) {
    showZeroQuantityPrizes = !!state.showZeroQuantity;
    document.getElementById('show-zero-quantity').checked = !!state.showZeroQuantity;
  }

  if (state.panel === 'play' && state.prizes && state.prizes.length > 0) {
    prizes = state.prizes;
    lastRotation = state.lastRotation || 0;

    document.getElementById('setup').style.display = 'none';
    document.getElementById('play').style.display = 'flex';

    const isPCMode = state.deviceMode === 'pc';
    const toggleBtn = document.getElementById('toggle-controls-btn');
    if (isPCMode) {
      toggleBtn.style.display = 'none';
    } else {
      toggleBtn.style.display = 'flex';
    }

    if (state.showControls === false) {
      showControlButtons = false;
      document.querySelectorAll('.control-btn').forEach(btn => { btn.style.display = 'none'; });
      const tb = document.getElementById('toggle-controls-btn');
      if (tb) tb.textContent = '🙈';
    }

    drawWheel();

    const wheel = document.getElementById('wheel');
    wheel.style.transition = 'none';
    wheel.style.transform = `rotate(${lastRotation}deg)`;

    restoreHistoryFromLocalStorage();
  } else {
    updateWheel();
  }
}

function saveHistoryToLocalStorage() {
  if (historyData.length === 0) return;
  const header = "Thoi gian, Giai thuong\n";
  const rows = historyData.map(item => `${item.time},${item.prize}`).join("\n");
  const csvContent = header + rows;
  localStorage.setItem("lich_su_trung_thuong_csv", csvContent);
}

function downloadHistoryAsCSV() {
  let csvContent = localStorage.getItem("lich_su_trung_thuong_csv");
  if (!csvContent) return;
  
  const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'lich_su_trung_thuong.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function restoreHistoryFromLocalStorage() {
  let csvContent = localStorage.getItem("lich_su_trung_thuong_csv");
  if (!csvContent) return;
  let lines = csvContent.trim().split("\n");
  lines = lines.slice(1);
  historyData = [];
  lines.forEach(line => {
    const [time, prize] = line.split(",");
    if (time && prize) historyData.push({ time: time.trim(), prize: prize.trim() });
  });
  if (historyData.length > 0) {
    const last = historyData[historyData.length - 1];
    const ul = document.getElementById("history-list");
    ul.innerHTML = "";
    const li = document.createElement("li");
    li.textContent = `${last.time} - ${last.prize}`;
    ul.appendChild(li);
    document.getElementById("result").textContent = `Chúc mừng bạn đã trúng: ${last.prize}`;
  }
}

function updateWheel() {
  const input = document.getElementById("prize-input").value;
  prizes = input.split("\n").map(l => {
    const parts = l.split("|").map(x => x.trim());
    const label = parts[0];
    const count = parseInt(parts[1]);
    const weight = (parts[2] && !isNaN(parseFloat(parts[2]))) ? parseFloat(parts[2]) : 1;
    const customColor = (parts[3] && parts[3] !== '') ? parts[3] : undefined;
    
    return { label: label, count: count, weight: weight, customColor: customColor };
  }).filter(p => p.label && !isNaN(p.count));
  
  drawWheel();
}

function drawWheel() {
  const svg = document.getElementById("wheel-svg");
  if (!svg) return;
  svg.innerHTML = "";
  
  const prizesToDraw = showZeroQuantityPrizes ? prizes : prizes.filter(p => p.count > 0);

  if (prizesToDraw.length === 0) return;

  const slice = 360 / prizesToDraw.length;
  prizesToDraw.forEach((p, i) => {
    const s = i * slice,
          e = s + slice;
    const color = p.customColor || `hsl(${(i * 360) / prizesToDraw.length},70%,50%)`;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    const laf = slice > 180 ? 1 : 0;
    const x1 = 100 + 100 * Math.cos(((s - 90) * Math.PI) / 180);
    const y1 = 100 + 100 * Math.sin(((s - 90) * Math.PI) / 180);
    const x2 = 100 + 100 * Math.cos(((e - 90) * Math.PI) / 180);
    const y2 = 100 + 100 * Math.sin(((e - 90) * Math.PI) / 180);
    path.setAttribute("d", `M100,100 L${x1},${y1} A100,100 0 ${laf} 1 ${x2},${y2} Z`);
    path.setAttribute("fill", color);
    svg.appendChild(path);

    const ta = s + slice / 2;
    const tx = 100 + 60 * Math.cos(((ta - 90) * Math.PI) / 180);
    const ty = 100 + 60 * Math.sin(((ta - 90) * Math.PI) / 180);
    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", tx);
    text.setAttribute("y", ty);
    text.setAttribute("fill", "white");
    const fontSize = prizesToDraw.length > 10 ? 8 : 10;
    text.setAttribute("font-size", fontSize);
    text.setAttribute("font-weight", "bold");
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("alignment-baseline", "middle");
    text.setAttribute("transform", `rotate(${ta}, ${tx}, ${ty})`);
    text.textContent = p.label;
    svg.appendChild(text);
  });
}

function pickPrizeIndexByCount() {
  const availablePrizes = prizes.filter(p => p.count > 0);
  
  if (availablePrizes.length === 0) {
    return -1;
  }

  const total = availablePrizes.reduce((acc, p) => acc + p.count * p.weight, 0);

  if (total === 0) {
    return -1;
  }
  
  let r = Math.random() * total;  
  
  for (let i = 0; i < availablePrizes.length; i++) {
    const currentPrizeWeight = availablePrizes[i].count * availablePrizes[i].weight;
    
    r -= currentPrizeWeight;
    
    if (r <= 0) {
      return prizes.findIndex(p => p.label === availablePrizes[i].label);
    }
  }
  
  return -1;  
}

function spinWheel() {
  if (prizes.length === 0 || spinning) return;
  
  const targetIndex = pickPrizeIndexByCount();
  if (targetIndex === -1) {
    alert("Không còn giải thưởng nào để quay!");
    return;
  }

  spinning = true;
  const wheel = document.getElementById("wheel");
  const resultBox = document.getElementById("result");
  resultBox.textContent = "";
  
  const prizesForSpinCalculation = showZeroQuantityPrizes ? prizes : prizes.filter(p => p.count > 0);
  if (prizesForSpinCalculation.length === 0) {
    alert("Không có giải thưởng nào hiển thị trên vòng quay!");
    spinning = false;
    return;
  }
  const slice = 360 / prizesForSpinCalculation.length;

  const spinRounds = Math.floor(Math.random() * 3) + 5;

  const currentRotation = lastRotation % 360;
  const targetPrizeInSpinArray = prizesForSpinCalculation.find(p => p.label === prizes[targetIndex].label);
  const targetPrizeIndexInSpinArray = prizesForSpinCalculation.indexOf(targetPrizeInSpinArray);
  
  const randomOffset = (Math.random() - 0.5) * (slice * 0.8);
  const targetAngle = (targetPrizeIndexInSpinArray * slice) + (slice / 2) + randomOffset;
  
  let rotationToTop = 360 - targetAngle - currentRotation;
  rotationToTop = (rotationToTop + 360) % 360;
  const rotationAmount = spinRounds * 360 + rotationToTop;
  lastRotation += rotationAmount;

  const durationSec = Math.random() * 2 + 5;
  const durationMs = durationSec * 1000;
  wheel.style.transition = `transform ${durationSec}s cubic-bezier(0.25, 0.1, 0.25, 1)`;
  wheel.style.transform = `rotate(${lastRotation}deg)`;

  if (spinSound) {
    spinSound.currentTime = 0;
    spinSound.play().catch(e => console.error("Lỗi khi phát âm thanh:", e));
  }

  setTimeout(() => {
    if (spinSound) {
      spinSound.pause();
      spinSound.currentTime = 0;
    }

    const prize = prizes[targetIndex];
    const timestamp = new Date().toLocaleTimeString();
    resultBox.textContent = `Chúc mừng bạn đã trúng: ${prize.label}`;
    prize.count--;
    
    drawWheel();

    const ul = document.getElementById("history-list");
    ul.innerHTML = "";
    const li = document.createElement("li");
    li.textContent = `${timestamp} - ${prize.label}`;
    ul.appendChild(li);

    historyData.push({ time: timestamp, prize: prize.label });
    saveHistoryToLocalStorage();

    if (window.confetti) {
        confetti({
          particleCount: 150,
          spread: 70,
          origin: { y: 0.6 },
        });
    }

    spinning = false;
    saveAppState();
  }, durationMs + 100);
}

function updateBackgroundFromFile() {
  const file = document.getElementById('bg-file').files[0];
  if (file) {
    const r = new FileReader();
    r.onload = (e) => {
      document.body.style.backgroundImage = `url('${e.target.result}')`;
    };
    r.readAsDataURL(file);
  }
}

function startGame() {
  const isPCMode = document.getElementById('mode-pc').checked;

  document.getElementById('setup').style.display = 'none';
  document.getElementById('play').style.display = 'flex';

  const toggleBtn = document.getElementById('toggle-controls-btn');
  if (isPCMode) {
    toggleBtn.style.display = 'none';
  } else {
    toggleBtn.style.display = 'flex';
  }

  updateWheel();
  saveAppState();
}

function backToSetup() {
  document.getElementById('prize-input').value = prizesToInputText(prizes);
  document.getElementById('play').style.display = 'none';
  document.getElementById('setup').style.display = 'flex';
  saveAppState();
}

function toggleControlButtons() {
    showControlButtons = !showControlButtons;
    
    const buttonsToToggle = document.querySelectorAll('.control-btn');
    buttonsToToggle.forEach(btn => {
        btn.style.display = showControlButtons ? "" : "none";
    });
    
    const toggleBtn = document.getElementById('toggle-controls-btn');
    if (toggleBtn) {
        toggleBtn.textContent = showControlButtons ? '👁️' : '🙈';
    }
}

window.addEventListener("DOMContentLoaded", () => {
  document.getElementById('update-button')?.addEventListener('click', updateWheel);
  document.getElementById('bg-file')?.addEventListener('change', updateBackgroundFromFile);
  document.getElementById('bg-button')?.addEventListener('click', () => document.getElementById('bg-file').click());
  
  document.getElementById('show-zero-quantity')?.addEventListener('change', (e) => {
    showZeroQuantityPrizes = e.target.checked;
    drawWheel();
  });

  document.getElementById('ready-button')?.addEventListener('click', startGame);
  document.getElementById('start-button')?.addEventListener('click', spinWheel);
  document.getElementById('setup-button')?.addEventListener('click', backToSetup);

  document.getElementById('toggle-controls-btn')?.addEventListener('click', toggleControlButtons);

  document.getElementById('download-history')?.addEventListener('click', () => {
    downloadHistoryAsCSV();

    const input = document.getElementById("prize-input").value;
    const initialPrizes = input.split("\n").map(l => {
        const parts = l.split("|").map(x => x.trim());
        return {
            label: parts[0],
            total: parseInt(parts[1] || '0')
        };
    }).filter(p => p.label && !isNaN(p.total));

    const availablePrizes = prizes.filter(p => p.count > 0);
    const totalPoints = availablePrizes.reduce((sum, p) => sum + (p.count * p.weight), 0);

    let report = "Thống kê giải thưởng:\n\n";

    initialPrizes.forEach(initialPrize => {
        const currentPrize = prizes.find(p => p.label === initialPrize.label);
        const remainingCount = currentPrize ? currentPrize.count : 0;
        const usedCount = initialPrize.total - remainingCount;

        let probability = 0;
        if (remainingCount > 0 && totalPoints > 0 && currentPrize) {
            const prizePoints = currentPrize.count * currentPrize.weight;
            probability = (prizePoints / totalPoints) * 100;
        }

        report += `${initialPrize.label} - Đã dùng: ${usedCount} - Còn lại: ${remainingCount} - Tỉ lệ trúng: ${probability.toFixed(1)}%\n`;
    });

    const totalRemaining = prizes.reduce((sum, p) => sum + p.count, 0);
    report += `\nTổng giải còn lại: ${totalRemaining}`;
    
    alert(report);
  });
  
  document.getElementById('clear-history')?.addEventListener('click', () => {
    if (confirm('Bạn có chắc chắn muốn xóa toàn bộ Lịch sử?')) {
      localStorage.removeItem('lich_su_trung_thuong_csv');
      historyData = [];
      document.getElementById("history-list").innerHTML = "";
      document.getElementById("result").textContent = "";
      alert('Đã xóa toàn bộ lịch sử quay!');
    }
  });

  spinSound = document.getElementById("spin-sound");

  restoreAppState();
});

// === THÊM LOGIC CHẶN LƯU/COPY ===
// Chặn click chuột phải
document.addEventListener('contextmenu', event => event.preventDefault());

document.addEventListener("keydown", function (e) {
  // Chặn F12 (Developer Tools) và Ctrl+S (Save)
  if (e.key === "F12" || (e.ctrlKey && e.key === 's')) {
    e.preventDefault();
  }

  // Logic cũ cho F1 và Space
  if (e.key === "F1") {
    e.preventDefault();
    toggleControlButtons();
  }
  if (
    (e.code === "Space" || e.key === " ") &&
    document.getElementById("play").style.display === "flex"
  ) {
    const active = document.activeElement;
    if (
      active.tagName !== "TEXTAREA" &&
      active.tagName !== "INPUT" &&
      active.tagName !== "BUTTON"
    ) {
      e.preventDefault();
      spinWheel();
    }
  }
});


window.addEventListener("beforeunload", function (e) {
  if (historyData.length > 0) {
      e.preventDefault();
      e.returnValue = "";
  }
});
</script>
</body>
</html>
